name: Build and Test 2socks

on:
  push:
    branches:
      - main  # أو اختر الفرع الذي تريد تنفيذ الـ Actions عليه
  pull_request:
    branches:
      - main  # أو اختر الفرع الذي تريد تنفيذ الـ Actions عليه

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Set up Go
      uses: actions/setup-go@v2
      with:
        go-version: '1.18'  # أو الإصدار الذي يناسب المشروع، تأكد من تطابقه مع go.mod

    - name: Install dependencies
      run: go mod tidy

    - name: Build the project
      run: go build

    - name: Run tests
      run: go test ./...

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v2
      with:
        name: build-artifacts
        path: ./build_output/  # اختر مسار المخرجات التي تريد رفعها
